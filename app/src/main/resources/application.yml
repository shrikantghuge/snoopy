spring:
  application:
    name: snoopy
  datasource:
    url: jdbc:h2:mem:snoopy;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

snoopy:
  tenant:
    default-id: tenant-default
    default-key: "01234567890123456789012345678901"
  security:
    allow-private-network: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
